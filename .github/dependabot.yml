version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

# NuGet and npm ecosystems are enabled when their manifests are introduced.
# This avoids failing/no-op update jobs before implementation scaffolds exist.
