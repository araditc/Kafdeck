name: v09-w80-disconnected-auth

on:
  push:
    branches: [codex/w80-disconnected-auth]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  signed-offline-auth:
    # The original push run42986123750 already passed. Rerun only by explicit dispatch;
    # later pushes extend the separately requested actual offline upgrade proof.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Stage exact official signed distribution and verify independent trust material
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          private="$RUNNER_TEMP/w80-signed-offline"
          mkdir -m 700 "$private"
          python3 -B deploy/dev/w80-signed-disconnected/stage.py "$private" "$GITHUB_WORKSPACE/artifacts/w80-disconnected" \
            0ba58f6c09c271f664f0f8c1fa62e2065844ca89a0397c0178ed5188f6096724
      - name: Stage pinned genuine identity and broker dependencies before disconnecting
        run: |
          set -euo pipefail
          private="$RUNNER_TEMP/w80-signed-offline"
          curl --fail --silent --show-error --location --max-time 180 \
            https://github.com/keycloak/keycloak/releases/download/26.8.1/keycloak-26.8.1.zip --output "$private/keycloak.zip"
          echo "4cd312c889af358a819a74a6c6f068f9ea159a6959e49924607cec95cfd4c1a4  $private/keycloak.zip" | sha256sum --check
          unzip -q "$private/keycloak.zip" -d "$private"
          pwsh -NoProfile -File deploy/dev/prepare-keycloak-g2.ps1 -KeycloakHome "$private/keycloak-26.8.1" \
            -OutputDirectory "$private/identity" -HttpsPort 18444
          chmod +x "$private/keycloak-26.8.1/bin/kc.sh"
          docker pull apache/kafka:4.3.1
          image_id="$(docker image inspect --format '{{.Id}}' apache/kafka:4.3.1)"
          container="$(docker create --network none "$image_id")"
          docker cp "$container:/opt/kafka" "$private/kafka"
          docker rm "$container"
          PRIVATE="$private" IMAGE_ID="$image_id" JAVA_RUNTIME="$JAVA_HOME_21_X64/bin/java" python3 -B - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          private=pathlib.Path(os.environ['PRIVATE'])
          def sha(path):
              with pathlib.Path(path).open('rb') as stream: return hashlib.file_digest(stream,'sha256').hexdigest()
          entries=[(str(path.relative_to(private/'kafka')),sha(path)) for path in sorted((private/'kafka').rglob('*')) if path.is_file()]
          dependencies={'keycloakVersion':'26.8.1','keycloakZipSha256':sha(private/'keycloak.zip'),
              'kafkaVersion':'4.3.1','kafkaImageConfigDigest':os.environ['IMAGE_ID'],
              'kafkaImageRepoDigests':json.loads(subprocess.check_output(['docker','image','inspect','apache/kafka:4.3.1']))[0]['RepoDigests'],
              'kafkaDistributionFilesSha256':hashlib.sha256(json.dumps(entries,separators=(',',':')).encode()).hexdigest(),
              'javaExecutableSha256':sha(os.environ['JAVA_RUNTIME']),
              'javaVersion':subprocess.run([os.environ['JAVA_RUNTIME'],'-version'],capture_output=True,text=True,check=True).stderr.splitlines()[0],
              'stagedBeforeNetworkIsolation':True,'runtimeDependencyDownloads':False}
          assert '21.' in dependencies['javaVersion']
          pathlib.Path('artifacts/w80-disconnected/dependencies.json').write_text(json.dumps(dependencies,sort_keys=True,indent=2)+'\n')
          PY
      - name: Execute real authentication and broker reads from installed signed apphosts without egress
        run: |
          set -euo pipefail
          sudo unshare --net env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME="$RUNNER_TEMP/w80-signed-offline" \
            JAVA_HOME="$JAVA_HOME_21_X64" COSIGN="$(command -v cosign)" \
            bash "$GITHUB_WORKSPACE/deploy/dev/w80-signed-disconnected/offline.sh" \
            "$RUNNER_TEMP/w80-signed-offline" "$GITHUB_WORKSPACE/artifacts/w80-disconnected"
      - name: Retain public evidence whitelist
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: w80-disconnected-auth-01c7553-${{ github.run_id }}
          path: |
            artifacts/w80-disconnected/signed-input.json
            artifacts/w80-disconnected/dependencies.json
            artifacts/w80-disconnected/journey.json
          if-no-files-found: warn

  official-offline-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.403'
      - name: Stage official signed final media and actual published v0.8 image bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          private="$RUNNER_TEMP/w80-signed-offline"
          mkdir -m 700 "$private"
          python3 -B deploy/dev/w80-signed-disconnected/stage.py "$private" "$GITHUB_WORKSPACE/artifacts/w80-offline-upgrade" \
            0ba58f6c09c271f664f0f8c1fa62e2065844ca89a0397c0178ed5188f6096724
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          python3 -B deploy/dev/w80-signed-disconnected/stage-upgrade.py "$private" "$GITHUB_WORKSPACE/artifacts/w80-offline-upgrade"
          docker pull postgres:18.6-alpine
          image_id="$(docker image inspect --format '{{.Id}}' postgres:18.6-alpine)"
          printf '%s\n' "$image_id" > "$private/postgres-image.txt"
          PRIVATE="$private" IMAGE_ID="$image_id" python3 -B - <<'PY'
          import json,os,pathlib,secrets,subprocess
          private=pathlib.Path(os.environ['PRIVATE'])
          password=secrets.token_hex(24)
          (private/'postgres-password.txt').write_text(password)
          (private/'postgres.env').write_text('POSTGRES_USER=offline_fixture\nPOSTGRES_DB=offline_fixture\nPOSTGRES_PASSWORD='+password+'\n')
          evidence={'imageConfigDigest':os.environ['IMAGE_ID'],
                    'imageRepoDigests':json.loads(subprocess.check_output(['docker','image','inspect','postgres:18.6-alpine']))[0]['RepoDigests'],
                    'stagedBeforeNetworkIsolation':True,'network':'none','runtimeDependencyDownloads':False}
          pathlib.Path('artifacts/w80-offline-upgrade/postgres-fixture.json').write_text(json.dumps(evidence,sort_keys=True,indent=2)+'\n')
          PY
      - name: Upgrade both actual official-v0.8 databases using signed v0.9 in a fresh loopback-only namespace
        run: |
          set -euo pipefail
          private="$RUNNER_TEMP/w80-signed-offline"
          image_id="$(cat "$private/postgres-image.txt")"
          container="$(docker create --pull=never --network=none --env-file "$private/postgres.env" "$image_id")"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker start "$container" >/dev/null
          for attempt in $(seq 1 90); do
            if docker exec "$container" pg_isready -U offline_fixture >/dev/null 2>&1; then break; fi
            sleep 1
          done
          pid="$(docker inspect --format '{{.State.Pid}}' "$container")"
          sudo nsenter --target "$pid" --net env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            HOME="$private" COSIGN="$(command -v cosign)" \
            bash "$GITHUB_WORKSPACE/deploy/dev/w80-signed-disconnected/offline-upgrade.sh" \
            "$private" "$GITHUB_WORKSPACE/artifacts/w80-offline-upgrade"
      - name: Retain exact official-source offline upgrade evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: w80-offline-upgrade-01c7553-${{ github.run_id }}
          path: |
            artifacts/w80-offline-upgrade/signed-input.json
            artifacts/w80-offline-upgrade/upgrade-input.json
            artifacts/w80-offline-upgrade/postgres-fixture.json
            artifacts/w80-offline-upgrade/offline-upgrade.json
          if-no-files-found: warn
