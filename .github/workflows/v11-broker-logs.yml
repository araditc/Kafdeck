name: v11-broker-logs
on:
  pull_request:
    paths:
      - 'tools/broker-host/**'
      - 'src/backend/Kafdeck.Api/BrokerLog*.cs'
      - 'src/backend/Kafdeck.Api/BrokerHost*.cs'
      - 'src/frontend/src/features/monitoring/**'
      - 'src/frontend/tests/host-harness/**'
      - 'tests/Kafdeck.Architecture.Tests/V11BrokerLogTests.cs'
      - 'deploy/dev/broker-host-native.sh'
      - 'deploy/dev/broker-log-browser.cjs'
      - '.github/workflows/v11-broker-logs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v11-broker-logs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  systemd-broker-logs:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Check log adapter boundaries
        run: python3 -m unittest discover -s tools/broker-host -p 'test_logs.py'
      - name: Provision two native systemd brokers and their scoped diagnostics
        env:
          KAFDECK_NATIVE_LOG_FIXTURE: '1'
        run: bash deploy/dev/broker-host-native.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build the production Brokers and Alerts components for the harness
        run: |
          npm ci --prefix src/frontend --ignore-scripts --no-audit --no-fund
          node src/frontend/tests/host-harness/build.mjs
          npm ci --prefix deploy/dev/browser-g2 --ignore-scripts --no-audit --no-fund
          deploy/dev/browser-g2/node_modules/.bin/playwright install --with-deps chromium
          echo "KAFDECK_HOST_UI_DIST=$GITHUB_WORKSPACE/src/frontend/dist/host-harness" >> "$GITHUB_ENV"
          echo "KAFDECK_HOST_LOG_BROWSER_SCRIPT=$GITHUB_WORKSPACE/deploy/dev/broker-log-browser.cjs" >> "$GITHUB_ENV"
      - name: Emit diagnostics after both Kafka units are ready
        run: |
          set -euo pipefail
          lab="$GITHUB_WORKSPACE/deploy/dev/.generated/v11-host-native"
          touch "$lab/emit-logs"
          deadline=$((SECONDS + 15))
          until test -s "$lab/time-1" && test -s "$lab/time-2"; do
            test "$SECONDS" -lt "$deadline"
            sleep 1
          done
          sudo journalctl --sync
          for broker in 1 2; do
            if [[ "$broker" == 1 ]]; then unit=kafdeck-v11-kafka; marker=native-486-primary
            else unit=kafdeck-v11-kafka-sibling; marker=native-486-sibling; fi
            at=$(cat "$lab/time-$broker")
            sudo journalctl --no-pager --output=cat --since="@$at" "_SYSTEMD_UNIT=$unit.service" |
              grep -F -- "$marker" >/dev/null
          done
          echo "KAFDECK_HOST_LOG_TIME=$(cat "$lab/time-1")" >> "$GITHUB_ENV"
          echo "KAFDECK_HOST_LOG_SIBLING_TIME=$(cat "$lab/time-2")" >> "$GITHUB_ENV"
      - name: Verify permission, redaction and real journal isolation from the dashboard
        run: |
          dotnet restore tests/Kafdeck.Architecture.Tests/Kafdeck.Architecture.Tests.csproj --locked-mode
          dotnet test tests/Kafdeck.Architecture.Tests/Kafdeck.Architecture.Tests.csproj --no-restore --filter 'FullyQualifiedName~V11BrokerLog' --logger 'trx;LogFileName=broker-logs.trx' --results-directory artifacts/host-acceptance
          python3 scripts/ci/require-complete-trx.py artifacts/host-acceptance/broker-logs.trx V11BrokerLogTests:4 V11BrokerLogLiveTests:1
      - name: Stop owned lab units
        if: always()
        run: sudo systemctl stop kafdeck-v11-kafka.service kafdeck-v11-kafka-sibling.service || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: v11-native-broker-log-acceptance
          path: artifacts/host-acceptance/
          retention-days: 30
