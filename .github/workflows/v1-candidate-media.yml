name: v1-candidate-media

on:
  pull_request:
    paths:
      - 'scripts/release/v1_media.py'
      - 'scripts/release/v1_media_selection.json'
      - '.github/workflows/v1-candidate-media.yml'
  workflow_dispatch:
    inputs:
      stable_runs:
        description: 'Stable build run IDs, in native,distribution,integrations order. Leave empty for the historical RC.'
        type: string
        required: false
      candidate_runs:
        description: '1.1 RC build run IDs in native,distribution,integrations order'
        type: string
        required: false
      manifest_sha256:
        description: 'Owner-reviewed manifest SHA256 (leave empty for preparation)'
        type: string
        required: false
      owner_decision:
        description: 'Exact signing statement from the release owner'
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    outputs:
      source: ${{ steps.identity.outputs.source }}
      version: ${{ steps.identity.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assemble exact main producer bytes
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_RUNS: ${{ inputs.stable_runs }}
          CANDIDATE_RUNS: ${{ inputs.candidate_runs }}
        run: |
          set -euo pipefail
          if [[ -n "$CANDIDATE_RUNS" ]]; then
            [[ -z "$STABLE_RUNS" ]]
            python3 scripts/release/v1_media.py prepare staging --candidate-runs "$CANDIDATE_RUNS"
          else
            python3 scripts/release/v1_media.py prepare staging --stable-runs "$STABLE_RUNS"
          fi
      - name: Record review digest
        id: identity
        run: |
          echo "source=$(jq -er .source staging/manifest.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -er .version staging/manifest.json)" >> "$GITHUB_OUTPUT"
          sha256sum staging/manifest.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: v1-candidate-manifest
          path: staging/manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: v1-candidate-full-distribution
          path: staging/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  sign:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.owner_decision != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check owner and exact decision
        env:
          DECISION: ${{ inputs.owner_decision }}
          MANIFEST: ${{ inputs.manifest_sha256 }}
          SOURCE: ${{ needs.prepare.outputs.source }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/release/assert-v08-release-owner.sh
          [[ "$MANIFEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DECISION" == "SIGN v$VERSION full-distribution FROM $SOURCE MANIFEST $MANIFEST" ]]
      - name: Verify exact approved packet
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: ${{ inputs.manifest_sha256 }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name v1-candidate-full-distribution --dir staging
          python3 scripts/release/v1_media.py verify staging --manifest-sha256 "$MANIFEST"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Sign manifest and verify offline against workflow identity
        run: |
          set -euo pipefail
          cosign trusted-root create --with-default-services --out staging/trusted-root.json
          cosign sign-blob --yes --new-bundle-format=true --oidc-provider=github-actions \
            --bundle staging/manifest.sigstore.json staging/manifest.json
          sudo unshare --net "$(command -v cosign)" verify-blob --offline \
            --bundle staging/manifest.sigstore.json --trusted-root staging/trusted-root.json \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --certificate-github-workflow-sha "$GITHUB_SHA" staging/manifest.json
          sha256sum staging/trusted-root.json staging/manifest.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: v1-candidate-signature
          path: |
            staging/manifest.json
            staging/manifest.sigstore.json
            staging/trusted-root.json
          if-no-files-found: error
          retention-days: 90
