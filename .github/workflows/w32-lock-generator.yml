name: w32-lock-generator

on:
  push:
    branches:
      - feat/v0.5-w32-mutation-kernel

permissions:
  contents: read

jobs:
  generate-lock-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Regenerate package lock files
        run: dotnet restore Kafdeck.slnx --force-evaluate

      - name: Upload exact generated lock files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: w32-package-locks
          path: |
            src/**/packages.lock.json
            tests/**/packages.lock.json
          if-no-files-found: error
