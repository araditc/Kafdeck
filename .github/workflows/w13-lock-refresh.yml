name: w13-lock-refresh

on:
  pull_request:
    paths:
      - 'Directory.Packages.props'
      - 'src/backend/Kafdeck.Api/Kafdeck.Api.csproj'
      - '.github/workflows/w13-lock-refresh.yml'

permissions:
  contents: read

jobs:
  generate-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Generate exact NuGet locks
        run: dotnet restore Kafdeck.slnx --force-evaluate

      - name: Emit generated lockfiles
        shell: bash
        run: |
          echo "===API_LOCK_BEGIN==="
          base64 -w0 src/backend/Kafdeck.Api/packages.lock.json
          echo
          echo "===API_LOCK_END==="
          echo "===TEST_LOCK_BEGIN==="
          base64 -w0 tests/Kafdeck.Architecture.Tests/packages.lock.json
          echo
          echo "===TEST_LOCK_END==="
