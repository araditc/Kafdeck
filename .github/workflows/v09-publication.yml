name: v09-publication

on:
  push:
    branches: [codex/v09-publication]
  workflow_dispatch:
    inputs:
      selection_sha256:
        description: 'Reviewed prepare-selection SHA256; empty means read-only preparation'
        required: false
        type: string
      publisher_commit:
        description: 'Final reviewed protected driver SHA; mandatory for conditional publication'
        required: false
        type: string
      readiness_run_id:
        description: 'Actual successful protected-main v09-release-readiness run matching source01c, manifestb638 and W80packet5e865'
        required: false
        type: string
      owner_approval:
        description: 'Exact conditional PUBLISH phrase from reviewed selection; leave empty for read-only/local-registry dry-run'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: v09-publication-driver
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Prove owner/protection/decision/tamper guards and signed-layer binding
        run: python3 -B -m unittest discover -s publication/v09 -p 'test_*.py' -v

  local-proof:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Prove actual runtime-tag collision rejection and LOCAL key sign/attest/verify without egress
        run: python3 -B publication/v09/local_proof.py
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v09-local-proof-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/v09-publication/local-proof.json
          if-no-files-found: warn

  prepare-local-transport:
    # Heavy immutable-media preparation runs once after final review/protection.
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, local-proof]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Prepare exact signed media and deterministic two-architecture OCI index without publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B publication/v09/driver.py prepare
      - name: Prove local digest transport and remote config/layer hashes with foreign-tag preservation
        run: python3 -B publication/v09/driver.py local-transport
      - name: Retain reviewable selection and local-only transport proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v09-publication-prepare-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/v09-publication/publication-selection.json
            artifacts/v09-publication/local-transport.json
          if-no-files-found: warn

  authorize-publication:
    if: github.event_name == 'workflow_dispatch' && inputs.owner_approval != '' && inputs.publisher_commit == github.sha
    needs: [validate, prepare-local-transport]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.admit.outputs.authorized }}
    env:
      GH_TOKEN: ${{ github.token }}
      SELECTION_SHA256: ${{ inputs.selection_sha256 }}
      PUBLISHER_COMMIT: ${{ inputs.publisher_commit }}
      READINESS_RUN_ID: ${{ inputs.readiness_run_id }}
      OWNER_APPROVAL: ${{ inputs.owner_approval }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Read-only owner, exact SHA and actual branch protection preflight
        run: python3 -B publication/v09/driver.py preflight
      - name: Retrieve this run's small prepared selection
        run: gh run download "$GITHUB_RUN_ID" --repo araditc/Kafdeck --name "v09-publication-prepare-$GITHUB_SHA-$GITHUB_RUN_ID" --dir artifacts/v09-publication
      - name: Admit actual successful exact-input main readiness before any write/OIDC job exists
        id: admit
        run: |
          python3 -B publication/v09/driver.py admission
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  publish:
    if: needs.authorize-publication.outputs.authorized == 'true'
    needs: authorize-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      REGISTRY_TOKEN: ${{ github.token }}
      SELECTION_SHA256: ${{ inputs.selection_sha256 }}
      PUBLISHER_COMMIT: ${{ inputs.publisher_commit }}
      READINESS_RUN_ID: ${{ inputs.readiness_run_id }}
      OWNER_APPROVAL: ${{ inputs.owner_approval }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reject missing owner decision/unprotected or advanced driver before regeneration
        run: python3 -B publication/v09/driver.py preflight
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Reproduce the approved selection from immutable signed CI media
        run: python3 -B publication/v09/driver.py prepare
      - name: Conditionally publish only after actual matching protected-main readiness
        run: python3 -B publication/v09/driver.py publish
      - name: Retain publication result and final approved metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v09-publication-result-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/v09-publication/publication-selection.json
            artifacts/v09-publication/publication-result.json
            artifacts/v09-publication/assets/SHA256SUMS
            artifacts/v09-publication/registry-*.json
          if-no-files-found: warn
