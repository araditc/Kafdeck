name: v09-w81-signed-helm-auth

on:
  push:
    branches: [codex/w81-helm-auth-lifecycle]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  signed-helm-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.403'
      - name: Verify exact official signed source and immutable media
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          private="$RUNNER_TEMP/w81-signed-helm"
          mkdir -m700 "$private"
          python3 -B deploy/dev/w80-signed-disconnected/stage.py "$private" "$GITHUB_WORKSPACE/artifacts/w81-signed-helm" \
            0ba58f6c09c271f664f0f8c1fa62e2065844ca89a0397c0178ed5188f6096724
      - name: Stage pinned real identity and Kafka distributions
        run: |
          set -euo pipefail
          private="$RUNNER_TEMP/w81-signed-helm"
          curl --fail --silent --show-error --location --max-time 180 \
            https://github.com/keycloak/keycloak/releases/download/26.8.1/keycloak-26.8.1.zip --output "$private/keycloak.zip"
          echo "4cd312c889af358a819a74a6c6f068f9ea159a6959e49924607cec95cfd4c1a4  $private/keycloak.zip" | sha256sum --check
          unzip -q "$private/keycloak.zip" -d "$private"
          pwsh -NoProfile -File deploy/dev/prepare-keycloak-g2.ps1 -KeycloakHome "$private/keycloak-26.8.1" \
            -OutputDirectory "$private/identity" -HttpsPort 18444
          chmod +x "$private/keycloak-26.8.1/bin/kc.sh"
          docker pull apache/kafka:4.3.1
          image_id="$(docker image inspect --format '{{.Id}}' apache/kafka:4.3.1)"
          container="$(docker create --network none "$image_id")"
          docker cp "$container:/opt/kafka" "$private/kafka"
          docker rm "$container"
          docker image inspect apache/kafka:4.3.1 --format '{{json .RepoDigests}}' > artifacts/w81-signed-helm/kafka-image-digests.json
      - name: Exercise exact signed chart and image with genuine authentication and retained state
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          bash deploy/dev/w81-signed-helm/run.sh "$RUNNER_TEMP/w81-signed-helm" "$GITHUB_WORKSPACE/artifacts/w81-signed-helm"
      - name: Retain sanitized lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: w81-signed-helm-auth-01c7553-${{ github.run_id }}
          path: |
            artifacts/w81-signed-helm/*.json
            artifacts/w81-signed-helm/*.ndjson
          if-no-files-found: warn
