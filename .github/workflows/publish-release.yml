name: publish-release

on:
  pull_request:
    paths:
      - '.github/workflows/publish-release.yml'
      - '.github/release/release.json'
      - 'docs/releases/**'
      - 'Dockerfile'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-release.yml'
      - '.github/release/release.json'

permissions:
  contents: read

jobs:
  quality:
    name: release-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate release manifest
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' .github/release/release.json)"
          title="$(jq -r '.title' .github/release/release.json)"
          notes="$(jq -r '.notes' .github/release/release.json)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$ ]]
          test -n "$title"
          test -f "$notes"

      - name: Validate repository structure and workflow pinning
        run: bash scripts/ci/validate-repository.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Backend build and tests
        run: bash scripts/ci/backend.sh

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'

      - name: Frontend build and tests
        run: bash scripts/ci/frontend.sh

  compatibility:
    name: release-kafka-${{ matrix.kafka-version }}-${{ matrix.tier }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - kafka-version: '4.3.1'
            tier: tier1
          - kafka-version: '4.2.1'
            tier: tier1
          - kafka-version: '4.1.2'
            tier: tier1
          - kafka-version: '3.9.2'
            tier: tier2
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend dependencies
        run: dotnet restore Kafdeck.slnx --locked-mode

      - name: Run read-only Kafka security and compatibility matrix
        env:
          KAFDECK_KAFKA_VERSION: ${{ matrix.kafka-version }}
        run: bash scripts/ci/kafka-smoke.sh

  evidence:
    name: release-evidence
    needs: [quality, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.manifest.outputs.version }}
      title: ${{ steps.manifest.outputs.title }}
      notes: ${{ steps.manifest.outputs.notes }}
      image: ${{ steps.manifest.outputs.image }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Load release manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' .github/release/release.json)"
          title="$(jq -r '.title' .github/release/release.json)"
          notes="$(jq -r '.notes' .github/release/release.json)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "version=$version"
            echo "title=$title"
            echo "notes=$notes"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable release candidate once
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          provenance: mode=max
          tags: |
            ${{ steps.manifest.outputs.image }}:${{ steps.manifest.outputs.version }}
            ${{ steps.manifest.outputs.image }}:sha-${{ github.sha }}

      - name: Select exact candidate reference
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "CANDIDATE_REF=${{ steps.manifest.outputs.image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_ENV"
          else
            echo "CANDIDATE_REF=${{ steps.manifest.outputs.image }}:${{ steps.manifest.outputs.version }}" >> "$GITHUB_ENV"
          fi

      - name: Generate SPDX SBOM for exact candidate
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.CANDIDATE_REF }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Scan exact candidate for High/Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.CANDIDATE_REF }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: false
          exit-code: '1'

      - name: Retain exact-revision evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            sbom.spdx.json
            trivy-results.sarif
          if-no-files-found: warn

      - name: Install cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Keyless-sign exact published digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.manifest.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  publish:
    name: publish-github-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish idempotent GitHub Release on exact SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.evidence.outputs.version }}
          RELEASE_TITLE: ${{ needs.evidence.outputs.title }}
          NOTES_PATH: ${{ needs.evidence.outputs.notes }}
          IMAGE: ${{ needs.evidence.outputs.image }}
          DIGEST: ${{ needs.evidence.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          existing_release_target=""
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_release_target="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq '.object.sha')"
            if [[ "$existing_release_target" != "$GITHUB_SHA" ]]; then
              echo "::error::Release $VERSION already exists on $existing_release_target, expected $GITHUB_SHA"
              exit 1
            fi
            echo "Release $VERSION already exists on exact source SHA; publication is idempotently complete."
            exit 0
          fi

          tag_target=""
          if tag_target="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq '.object.sha' 2>/dev/null)"; then
            if [[ "$tag_target" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $VERSION already exists on $tag_target, expected $GITHUB_SHA"
              exit 1
            fi
            tag_args=(--verify-tag)
          else
            tag_args=(--target "$GITHUB_SHA")
          fi

          cp "$NOTES_PATH" /tmp/release-notes.md
          {
            echo
            echo "## Immutable OCI image"
            echo
            echo "`$IMAGE@$DIGEST`"
            echo
            echo "SBOM and vulnerability-scan evidence are retained by the release workflow for source SHA `$GITHUB_SHA`."
          } >> /tmp/release-notes.md

          gh release create "$VERSION"             --repo "$GITHUB_REPOSITORY"             "${tag_args[@]}"             --title "$RELEASE_TITLE"             --notes-file /tmp/release-notes.md
