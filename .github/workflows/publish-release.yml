name: publish-release

on:
  pull_request:
    paths:
      - '.github/workflows/publish-release.yml'
      - '.github/release/**'
      - 'scripts/release/**'
      - 'docs/releases/**'
      - 'Directory.Build.props'
      - 'src/frontend/package*.json'
      - 'Dockerfile'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/publish-release.yml'
      - '.github/release/**'
      - 'scripts/release/**'
      - 'Directory.Build.props'
      - 'src/frontend/package*.json'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact current main SHA with a completed v0.8 Main packet'
        required: true
        type: string
      run_ids:
        description: 'Comma-separated successful producer run IDs for that exact SHA'
        required: true
        type: string
      archive_sha256:
        description: 'Owner-reviewed offline candidate archive SHA256 from the Main packet'
        required: true
        type: string
      owner_approval:
        description: 'Type PUBLISH v0.8 FROM followed by the exact source SHA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v08-publication-${{ github.event_name == 'workflow_dispatch' && 'manual' || github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: release-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate repository structure and workflow pinning
        run: bash scripts/ci/validate-repository.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Backend build and tests
        run: bash scripts/ci/backend.sh

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Frontend build and tests
        run: bash scripts/ci/frontend.sh

  compatibility:
    name: release-kafka-${{ matrix.kafka-version }}-${{ matrix.tier }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - kafka-version: '4.3.1'
            tier: tier1
          - kafka-version: '4.2.1'
            tier: tier1
          - kafka-version: '4.1.2'
            tier: tier1
          - kafka-version: '3.9.2'
            tier: tier2
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend dependencies
        run: dotnet restore Kafdeck.slnx --locked-mode

      - name: Run read-only Kafka security and compatibility matrix
        env:
          KAFDECK_KAFKA_VERSION: ${{ matrix.kafka-version }}
        run: bash scripts/ci/kafka-smoke.sh


  digest-transport-local:
    name: nonpublishing-digest-transport-and-owner-gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove owner rejection and digest-only transport against LOCAL registry
        run: bash scripts/release/test-v08-local-digest-transport.sh
      - name: Retain nonpublishing transport proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g6-local-digest-transport
          path: artifacts/g6-local-transport/g6-local-transport-evidence.json
          if-no-files-found: error
  readiness:
    name: verify-owner-selected-main-packet
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && contains(fromJSON('["ammarheidari","akhiabanchian"]'), github.actor) && contains(fromJSON('["ammarheidari","akhiabanchian"]'), github.triggering_actor)
    needs: [quality, compatibility, digest-transport-local]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - name: Checkout workflow source without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify explicit owner decision and exact Main evidence
        id: verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERIFIED_RUN_IDS: ${{ inputs.run_ids }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          OWNER_APPROVAL: ${{ inputs.owner_approval }}
        run: ./scripts/release/prepare-v08-publication.ps1
      - name: Retain verified candidate without publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owner-selected-v08-${{ steps.verify.outputs.source_sha }}
          path: artifacts/v08-publication-selected/*
          compression-level: 0
          if-no-files-found: error

  publish:
    name: explicitly-authorized-v08-publication
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && contains(fromJSON('["ammarheidari","akhiabanchian"]'), github.actor) && contains(fromJSON('["ammarheidari","akhiabanchian"]'), github.triggering_actor) && needs.readiness.outputs.verified == 'true'
    needs: [quality, compatibility, digest-transport-local, readiness]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: read
    steps:
      - name: Checkout exact authorized source without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.readiness.outputs.source_sha }}
      - name: Verify both protected owner identities before artifact IO
        run: bash scripts/release/assert-v08-release-owner.sh
      - name: Download only this workflow's verified candidate handoff
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.readiness.outputs.source_sha }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "owner-selected-v08-$SOURCE_SHA" --dir artifacts/v08-publication-selected
      - name: Set up pinned Buildx tooling
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Load the same verified candidate without rebuilding
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          OWNER_APPROVAL: ${{ inputs.owner_approval }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/load-v08-publication-candidate.sh
      - name: Re-scan the exact loaded candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.CANDIDATE_SCAN_REF }}
          format: sarif
          output: trivy-publication.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: false
          exit-code: '1'
      - name: Install cosign for authorized digest signing
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Publish only the approved image and immutable source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          OWNER_APPROVAL: ${{ inputs.owner_approval }}
          GH_TOKEN: ${{ github.token }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: bash scripts/release/publish-v08-approved-candidate.sh
      - name: Retain publication verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v08-publication-verification-${{ needs.readiness.outputs.source_sha }}
          path: |
            trivy-publication.sarif
            artifacts/v08-publication-selected/publication-result.json
            artifacts/v08-publication-selected/cosign-*.json
          if-no-files-found: warn
