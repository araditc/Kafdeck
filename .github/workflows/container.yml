name: container

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'deploy/docker/**'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'deploy/docker/**'

permissions:
  contents: read

jobs:
  build:
    name: container-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build OCI image
        run: docker build --pull --tag kafdeck:ci .
