name: codeql

on:
  pull_request:
    paths:
      - 'src/backend/**'
      - 'tests/backend/**'
      - 'src/frontend/**'
      - '.github/workflows/codeql.yml'
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'src/backend/**'
      - 'tests/backend/**'
      - 'src/frontend/**'
      - '.github/workflows/codeql.yml'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: codeql-${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

      - name: Stage SARIF diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/codeql
          if compgen -G "../results/*.sarif" >/dev/null; then
            cp ../results/*.sarif .artifacts/codeql/
          fi

      - name: Retain SARIF diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-${{ matrix.language }}-${{ github.sha }}
          path: .artifacts/codeql/*.sarif
          if-no-files-found: warn
