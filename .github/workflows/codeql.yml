name: codeql

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Directory.Build.props'
      - '.github/release/**'
      - 'src/backend/**'
      - 'tests/backend/**'
      - 'src/frontend/**'
      - 'src/mcp/**'
      - 'providers/terraform/**'
      - 'scripts/release/**'
      - '.github/workflows/codeql.yml'
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'Dockerfile'
      - 'Directory.Build.props'
      - '.github/release/**'
      - 'src/backend/**'
      - 'tests/backend/**'
      - 'src/frontend/**'
      - 'src/mcp/**'
      - 'providers/terraform/**'
      - 'scripts/release/**'
      - '.github/workflows/codeql.yml'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: codeql-${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript, go]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        if: matrix.language != 'go'
        uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

      - name: Build pinned Go provider
        if: matrix.language == 'go'
        env:
          GOTOOLCHAIN: go1.27.3
        run: |
          cd providers/terraform
          go build ./...

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

      - name: Stage SARIF diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/codeql
          if compgen -G "../results/*.sarif" >/dev/null; then
            cp ../results/*.sarif .artifacts/codeql/
          fi

      - name: Retain SARIF diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ matrix.language }}-${{ github.sha }}
          path: .artifacts/codeql/*.sarif
          include-hidden-files: true
          if-no-files-found: warn
