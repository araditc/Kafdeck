name: v05-persistence

on:
  pull_request:
    paths:
      - 'Directory.Packages.props'
      - 'src/backend/Modules/Kafdeck.Modules.Administration/**'
      - 'src/backend/Infrastructure/Kafdeck.Infrastructure.Persistence/**'
      - 'src/backend/Kafdeck.Core/Records/RecordsPurgeObservationContracts.cs'
      - 'src/backend/Modules/Kafdeck.Modules.Records/RecordsPurge*.cs'
      - 'src/backend/Infrastructure/Kafdeck.Infrastructure.Kafka/ConfluentKafkaRecordsPurge*.cs'
      - 'tests/Kafdeck.Architecture.Tests/V05RecordsPurgeTests.cs'
      - 'tests/Kafdeck.Architecture.Tests/KafkaRecordsPurgeIntegrationTests.cs'
      - 'tests/Kafdeck.Architecture.Tests/V05MutationKernelTests.cs'
      - 'tests/Kafdeck.Architecture.Tests/V05MutationPersistenceTests.cs'
      - 'tests/Kafdeck.Architecture.Tests/V06W41FleetConflictObligationTests.cs'
      - 'tests/Kafdeck.Architecture.Tests/V06W41FleetConflictRelationTests.cs'
      - 'tests/Kafdeck.Architecture.Tests/V06W41FleetConflictScopeTests.cs'
      - 'tests/Kafdeck.Architecture.Tests/V06W41FleetPersistenceTests.cs'
      - 'tests/Kafdeck.Architecture.Tests/V06W41FleetProgressTests.cs'
      - 'docs/implementation/v0.5-w40-readiness.md'
      - '.github/workflows/v05-persistence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v05-persistence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-persistence:
    name: mutation-persistence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: kafdeck
          POSTGRES_PASSWORD: kafdeck-ci-only
          POSTGRES_DB: kafdeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kafdeck -d kafdeck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore locked dependencies
        run: dotnet restore Kafdeck.slnx --locked-mode

      - name: Run v0.5 mutation kernel and W41 durable conflict tests
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
          KAFDECK_TEST_POSTGRES: 'Host=127.0.0.1;Port=5432;Username=kafdeck;Password=kafdeck-ci-only;Database=kafdeck;Pooling=false'
        run: >-
          dotnet test tests/Kafdeck.Architecture.Tests/Kafdeck.Architecture.Tests.csproj
          --configuration Release
          --no-restore
          --filter 'FullyQualifiedName~V05MutationKernelTests|FullyQualifiedName~V05MutationPersistenceTests|FullyQualifiedName~V06W41FleetConflictObligationTests|FullyQualifiedName~V06W41FleetConflictRelationTests|FullyQualifiedName~V06W41FleetConflictScopeTests|FullyQualifiedName~V06W41FleetPersistenceTests|FullyQualifiedName~V06W41FleetProgressTests'
          --logger 'console;verbosity=detailed'
