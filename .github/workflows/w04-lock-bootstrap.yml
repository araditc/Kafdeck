name: w04-lock-bootstrap

on:
  push:
    branches: [feat/v0.1-w04-kafka-adapter]

permissions:
  contents: read

jobs:
  lock-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Regenerate deterministic NuGet lock files
        run: dotnet restore Kafdeck.slnx --force-evaluate

      - name: Emit changed lock files
        shell: bash
        run: |
          for file in \
            src/backend/Infrastructure/Kafdeck.Infrastructure.Kafka/packages.lock.json \
            src/backend/Kafdeck.Api/packages.lock.json \
            tests/Kafdeck.Architecture.Tests/packages.lock.json; do
            echo "===== LOCKFILE:${file} ====="
            cat "${file}"
            echo "===== END_LOCKFILE:${file} ====="
          done
