name: kafka-smoke

on:
  pull_request:
    paths:
      - 'deploy/dev/**'
      - 'scripts/ci/kafka-smoke.sh'
      - 'src/backend/Infrastructure/Kafdeck.Infrastructure.Kafka/**'
      - 'src/backend/Kafdeck.Core/Kafka/**'
      - 'tests/Kafdeck.Architecture.Tests/Kafka*.cs'
      - 'Directory.Packages.props'
      - '.github/workflows/kafka-smoke.yml'
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'deploy/dev/**'
      - 'scripts/ci/kafka-smoke.sh'
      - 'src/backend/Infrastructure/Kafdeck.Infrastructure.Kafka/**'
      - 'src/backend/Kafdeck.Core/Kafka/**'
      - 'tests/Kafdeck.Architecture.Tests/Kafka*.cs'
      - 'Directory.Packages.props'
      - '.github/workflows/kafka-smoke.yml'

permissions:
  contents: read

concurrency:
  group: kafka-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kafka-smoke:
    name: kafka-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend dependencies
        run: dotnet restore Kafdeck.slnx --locked-mode

      - name: Start Kafka and verify CLI plus Kafdeck adapter operations
        run: bash scripts/ci/kafka-smoke.sh
