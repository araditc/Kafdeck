name: kafka-smoke

on:
  pull_request:
    paths:
      - 'deploy/dev/**'
      - 'scripts/ci/kafka-smoke.sh'
      - '.github/workflows/kafka-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/dev/**'
      - 'scripts/ci/kafka-smoke.sh'
      - '.github/workflows/kafka-smoke.yml'

permissions:
  contents: read

jobs:
  kafka-smoke:
    name: kafka-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start Kafka and verify admin operations
        run: bash scripts/ci/kafka-smoke.sh
