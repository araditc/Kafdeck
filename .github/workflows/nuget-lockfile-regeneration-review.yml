name: temporary-nuget-lockfile-regeneration

on:
  pull_request:
    paths:
      - 'Directory.Packages.props'
      - '.github/workflows/nuget-lockfile-regeneration-review.yml'

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Re-evaluate full solution lock graph
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Kafdeck.slnx --force-evaluate -p:RestoreLockedMode=false
          dotnet restore Kafdeck.slnx --locked-mode
          git diff --stat -- '**/packages.lock.json'
      - name: Preserve lock candidates for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-solution-lockfiles-candidate
          path: '**/packages.lock.json'
          if-no-files-found: error
