name: v08-g2-keycloak-upgrade

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: v08-g2-keycloak-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-patch-rolling-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: kafdeck
          POSTGRES_PASSWORD: kafdeck-g2-ci-only
          POSTGRES_DB: kafdeck
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kafdeck -d kafdeck"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Download both pinned actual server versions
        shell: bash
        run: |
          set -euo pipefail
          lab="$GITHUB_WORKSPACE/deploy/dev/.generated/g2-upgrade-ci"
          mkdir -p "$lab"
          for version in 26.8.0 26.8.1; do
            curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 \
              "https://github.com/keycloak/keycloak/releases/download/$version/keycloak-$version.zip" --output "$lab/keycloak-$version.zip"
          done
          printf '%s  %s\n' 7ed1de3fda2598369262613bf682aab7e233d80a38c405e91588f7a7454370a1 "$lab/keycloak-26.8.0.zip" | sha256sum --check
          printf '%s  %s\n' 4cd312c889af358a819a74a6c6f068f9ea159a6959e49924607cec95cfd4c1a4 "$lab/keycloak-26.8.1.zip" | sha256sum --check
          unzip -q "$lab/keycloak-26.8.1.zip" -d "$lab"
      - name: Prepare isolated identity and private fixture inputs
        shell: pwsh
        run: |
          $lab = "$env:GITHUB_WORKSPACE/deploy/dev/.generated/g2-upgrade-ci"
          ./deploy/dev/prepare-keycloak-g2.ps1 -KeycloakHome "$lab/keycloak-26.8.1" -OutputDirectory "$lab/identity" -HttpsPort 20443
          $bin = (& pg_config --bindir).Trim()
          [IO.File]::WriteAllText("$lab/admin-private.txt", 'Host=127.0.0.1;Port=5432;Username=kafdeck;Password=kafdeck-g2-ci-only;Database=kafdeck')
          @{user='kafdeck';bindAddress='127.0.0.1';port=5432;database='kafdeck';binDirectory=$bin;connectionStringFile="$lab/admin-private.txt"} | ConvertTo-Json | Set-Content "$lab/postgres-private.json"
          @{RootDirectory="$lab/scenarios";IdentityDirectory="$lab/identity";PostgresManifest="$lab/postgres-private.json";OldArchive="$lab/keycloak-26.8.0.zip";NewArchive="$lab/keycloak-26.8.1.zip";JavaHome=$env:JAVA_HOME_21_X64} | ConvertTo-Json | Set-Content "$lab/inputs-private.json"
          & chmod 600 "$lab/admin-private.txt" "$lab/postgres-private.json" "$lab/inputs-private.json"
          if ($LASTEXITCODE) { throw 'Private fixture file permissions failed.' }
      - name: Prove real old mixed and new servers with production token verification
        shell: bash
        run: |
          set -euo pipefail
          export KAFDECK_KEYCLOAK_UPGRADE_INPUTS="$GITHUB_WORKSPACE/deploy/dev/.generated/g2-upgrade-ci/inputs-private.json"
          export KAFDECK_G2_EVIDENCE_DIRECTORY="$GITHUB_WORKSPACE/artifacts/g2-upgrade-ci"
          dotnet restore Kafdeck.slnx --locked-mode
          dotnet build Kafdeck.slnx --configuration Release --no-restore -warnaserror
          dotnet test tests/Kafdeck.Architecture.Tests/Kafdeck.Architecture.Tests.csproj --configuration Release --no-build --no-restore \
            --filter 'FullyQualifiedName~V08G2KeycloakPatchUpgradeTests' --results-directory artifacts/g2-upgrade-ci --logger 'trx;LogFileName=keycloak-upgrade.trx'
          test -s "$KAFDECK_G2_EVIDENCE_DIRECTORY/keycloak-patch-rolling-upgrade-evidence.json"
          test -s "$KAFDECK_G2_EVIDENCE_DIRECTORY/keycloak-patch-upgrade-production-verifier-evidence.json"
          python3 - <<'PY'
          import xml.etree.ElementTree as E
          r=E.parse('artifacts/g2-upgrade-ci/keycloak-upgrade.trx').getroot()
          c=r.find('.//{*}Counters')
          assert c is not None and c.attrib.get('total')=='1' and c.attrib.get('passed')=='1' and c.attrib.get('notExecuted')=='0'
          PY
      - name: Retain only safe upgrade evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g2-actual-keycloak-patch-upgrade
          path: |
            artifacts/g2-upgrade-ci/keycloak-upgrade.trx
            artifacts/g2-upgrade-ci/keycloak-patch-rolling-upgrade-evidence.json
            artifacts/g2-upgrade-ci/keycloak-patch-upgrade-production-verifier-evidence.json
          if-no-files-found: error
