name: v09-w77-provider-profiles

on:
  pull_request:
    paths: ['tests/Kafdeck.Architecture.Tests/V09W77*', 'tests/Kafdeck.Architecture.Tests/G2HumanCliLaboratory.cs', 'scripts/ci/w77*', 'scripts/ci/require-w77-evidence.py', '.github/workflows/v09-w77*', 'src/backend/Infrastructure/Kafdeck.Infrastructure.Kafka/**', 'src/backend/Kafdeck.Core/Kafka/**', 'Directory.Packages.props']
  push:
    branches: [main]
    paths: ['tests/Kafdeck.Architecture.Tests/V09W77*', 'tests/Kafdeck.Architecture.Tests/G2HumanCliLaboratory.cs', 'scripts/ci/w77*', 'scripts/ci/require-w77-evidence.py', '.github/workflows/v09-w77*', 'src/backend/Infrastructure/Kafdeck.Infrastructure.Kafka/**', 'src/backend/Kafdeck.Core/Kafka/**', 'Directory.Packages.props']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v09-w77-profiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-provider-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { provider: apache, version: '4.3.1' }
          - { provider: apache, version: '4.2.1' }
          - { provider: apache, version: '4.1.2' }
          - { provider: apache, version: '3.9.2' }
          - { provider: confluent-platform, version: '8.3.2' }
          - { provider: redpanda, version: '25.3.11' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore exact locked graph
        run: dotnet restore Kafdeck.slnx --locked-mode
      - name: Actual isolated provider capability profile
        run: bash scripts/ci/w77-provider-profile.sh '${{ matrix.provider }}' '${{ matrix.version }}'
      - name: Require complete actual profile, image and cleanup artifacts
        run: >-
          python3 scripts/ci/require-w77-evidence.py --source-sha "$(git rev-parse HEAD)"
          --profile-dir 'artifacts/w77/${{ matrix.provider }}-${{ matrix.version }}'
          --manifest 'artifacts/w77/${{ matrix.provider }}-${{ matrix.version }}/manifest.json'
      - name: Retain source/version/capability/cleanup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: w77-${{ matrix.provider }}-${{ matrix.version }}
          path: artifacts/w77/${{ matrix.provider }}-${{ matrix.version }}/
          if-no-files-found: error
