          POSTGRES_USER: kafdeck
          POSTGRES_PASSWORD: kafdeck-g2-ci-only
          POSTGRES_DB: keycloak
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kafdeck -d keycloak"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Prepare two independent verified Keycloak runtimes
        shell: bash
        run: |
          set -euo pipefail
          lab="$GITHUB_WORKSPACE/deploy/dev/.generated/g2-ha"
          mkdir -p "$lab/node-a" "$lab/node-b"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 \
            https://github.com/keycloak/keycloak/releases/download/26.8.1/keycloak-26.8.1.zip \
            --output "$lab/keycloak.zip"
          printf '%s  %s\n' 4cd312c889af358a819a74a6c6f068f9ea159a6959e49924607cec95cfd4c1a4 "$lab/keycloak.zip" | sha256sum --check
          unzip -q "$lab/keycloak.zip" -d "$lab/node-a"
          unzip -q "$lab/keycloak.zip" -d "$lab/node-b"
          chmod +x "$lab"/node-*/keycloak-26.8.1/bin/kc.sh
      - name: Prepare isolated shared realm and public topology metadata
        shell: pwsh
        run: |
          $base = "$env:GITHUB_WORKSPACE/deploy/dev/.generated/g2-ha"
          $javaVersion = (& "$env:JAVA_HOME_21_X64/bin/java" -version 2>&1 | Select-Object -First 1).ToString()
          ./deploy/dev/prepare-keycloak-g2.ps1 -KeycloakHome "$base/node-a/keycloak-26.8.1" -OutputDirectory "$base/identity" -JavaVersion $javaVersion
          $identity = Get-Content "$base/identity/lab.json" -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Path "$base/node-b/keycloak-26.8.1/data/import" -Force | Out-Null
          Copy-Item -LiteralPath $identity.realmImportFile -Destination "$base/node-b/keycloak-26.8.1/data/import/kafdeck-g2-realm.json"
          @{
            keycloakVersion = '26.8.1'; issuer = 'https://localhost:19443/realms/kafdeck-g2'
            clientId = $identity.clientId; subject = $identity.subject; audience = $identity.audience
            caPemFile = $identity.caPemFile; clientPrivateKeyFile = $identity.clientPrivateKeyFile
            cache = 'ispn'; stack = 'jdbc-ping'; clusterMtls = $true
            nodes = @(
              @{ name = 'node-a'; endpoint = 'https://localhost:19443/realms/kafdeck-g2' },
              @{ name = 'node-b'; endpoint = 'https://localhost:19444/realms/kafdeck-g2' }
            )
          } | ConvertTo-Json -Depth 6 | Set-Content "$base/ha-lab.json" -Encoding utf8
      - name: Form genuine shared PostgreSQL distributed cache cluster
        shell: bash
        env:
          KC_DB_USERNAME: kafdeck
          KC_DB_PASSWORD: kafdeck-g2-ci-only
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          export JAVA_OPTS_APPEND='-Xms128m -Xmx512m'
          lab="$GITHUB_WORKSPACE/deploy/dev/.generated/g2-ha"
          export KC_HTTPS_KEY_STORE_PASSWORD="$(cat "$lab/identity/https-password.txt")"
          start_node() {
            node="$1"; https_port="$2"; cluster_port="$3"
            nohup "$lab/$node/keycloak-26.8.1/bin/kc.sh" start --db=postgres \
              --db-url-host=127.0.0.1 --db-url-port=5432 --db-url-database=keycloak \
              --db-pool-initial-size=2 --db-pool-min-size=2 --db-pool-max-size=8 \
              --http-enabled=false --http-host=127.0.0.1 --https-port="$https_port" \
              --hostname=https://localhost:19443 --https-key-store-file="$lab/identity/https.p12" \
              --cache=ispn --cache-embedded-node-name="$node" --cache-embedded-mtls-enabled=true \
              --cache-embedded-network-bind-address=127.0.0.1 --cache-embedded-network-bind-port="$cluster_port" \
              --import-realm > "$lab/$node.log" 2>&1 &
            printf '%s' "$!" > "$lab/$node.pid"
            for attempt in $(seq 1 150); do
              if curl --fail --silent --cacert "$lab/identity/ca.pem" --connect-timeout 1 --max-time 2 \
                "https://localhost:$https_port/realms/kafdeck-g2/.well-known/openid-configuration" > /dev/null; then return 0; fi
              sleep 1
            done
            echo 'Genuine clustered Keycloak node did not become ready.' >&2
            return 1
          }
          start_node node-a 19443 7800
          start_node node-b 19444 7810
          for attempt in $(seq 1 30); do
            if grep -Eq '\(2\).*node-a.*node-b' "$lab/node-a.log" && grep -Eq '\(2\).*node-a.*node-b' "$lab/node-b.log"; then exit 0; fi
            sleep 1
          done
          echo 'Both nodes must report the two-member distributed cache view.' >&2
          exit 1
      - name: Prove synchronized fresh assertion races and time-valid replays
        shell: bash
        run: |
          set -euo pipefail
          export KAFDECK_KEYCLOAK_G2_HA_LAB="$GITHUB_WORKSPACE/deploy/dev/.generated/g2-ha/ha-lab.json"
          export KAFDECK_G2_EVIDENCE_DIRECTORY="$GITHUB_WORKSPACE/artifacts/g2-ci/ha"
          dotnet restore Kafdeck.slnx --locked-mode
          dotnet test tests/Kafdeck.Architecture.Tests/Kafdeck.Architecture.Tests.csproj --configuration Release --no-restore \
            --filter 'FullyQualifiedName~V08G2KeycloakHaReplayTests' --results-directory artifacts/g2-ci/ha --logger 'trx;LogFileName=ha-replay.trx'
          python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); assert p["rounds"] == 10 and p["firstUseSuccessesPerRound"] == [1]*10 and p["timeValidConsumedReplayRejections"] == 20' \
            "$KAFDECK_G2_EVIDENCE_DIRECTORY/keycloak-ha-first-use-replay-evidence.json"
      - name: Retain sanitized identity cluster evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g2-keycloak-ha-replay
          path: |
            artifacts/g2-ci/ha/ha-replay.trx
            artifacts/g2-ci/ha/*-evidence.json
          if-no-files-found: error
      - name: Stop both isolated cluster nodes
        if: always()
        shell: bash
        run: |
          lab="$GITHUB_WORKSPACE/deploy/dev/.generated/g2-ha"
          for node in node-a node-b; do
            if [ -f "$lab/$node.pid" ]; then kill "$(cat "$lab/$node.pid")" 2>/dev/null || true; fi
          done
