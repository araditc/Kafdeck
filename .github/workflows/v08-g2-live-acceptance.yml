name: v08-g2-live-acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: v08-g2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loopback-boundaries:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore locked dependencies
        run: dotnet restore Kafdeck.slnx --locked-mode
      - name: Prove actual numeric-loopback listener boundaries
        run: >-
          dotnet test tests/Kafdeck.Architecture.Tests/Kafdeck.Architecture.Tests.csproj
          --configuration Release --no-restore
          --filter 'FullyQualifiedName~V08W67CliPkceLoopbackBoundaryTests|FullyQualifiedName~V08W67CliSocketCallbackTests|FullyQualifiedName~V08W67HumanCliBoundaryTests|FullyQualifiedName~V08W67GovernedBearerBoundaryTests|FullyQualifiedName~V08W67CriticalApprovalBoundaryTests|FullyQualifiedName~V08W67TopicLifecycleBoundaryTests|FullyQualifiedName~V08AuthorizationActionIsolationTests|FullyQualifiedName~V08W67ServiceCliBoundaryTests'

  real-human-cli-and-transports:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: kafdeck
          POSTGRES_PASSWORD: kafdeck-g2-ci-only
          POSTGRES_DB: kafdeck
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kafdeck -d kafdeck"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Download and verify pinned Keycloak
        shell: bash
        run: |
          set -euo pipefail
          lab="$GITHUB_WORKSPACE/deploy/dev/.generated/g2"
          mkdir -p "$lab"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 \
            https://github.com/keycloak/keycloak/releases/download/26.8.1/keycloak-26.8.1.zip \
            --output "$lab/keycloak.zip"
          printf '%s  %s\n' 4cd312c889af358a819a74a6c6f068f9ea159a6959e49924607cec95cfd4c1a4 "$lab/keycloak.zip" | sha256sum --check
          unzip -q "$lab/keycloak.zip" -d "$lab"
          chmod +x "$lab/keycloak-26.8.1/bin/kc.sh"
      - name: Prepare genuine human and service identities
        shell: pwsh
        run: |
          $env:JAVA_HOME = $env:JAVA_HOME_21_X64
          $javaVersion = (& "$env:JAVA_HOME/bin/java" -version 2>&1 | Select-Object -First 1).ToString()
          ./deploy/dev/prepare-keycloak-g2.ps1 -KeycloakHome "$env:GITHUB_WORKSPACE/deploy/dev/.generated/g2/keycloak-26.8.1" -JavaVersion $javaVersion -IncludeBrowserSignIn
      - name: Start isolated Keycloak HTTPS
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          lab="$GITHUB_WORKSPACE/deploy/dev/.generated/g2"
          export KC_HTTPS_KEY_STORE_PASSWORD="$(cat "$lab/identity/https-password.txt")"
          export KC_DB_URL="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["databaseUrl"])' "$lab/identity/lab.json")"
          nohup "$lab/keycloak-26.8.1/bin/kc.sh" start --http-host=127.0.0.1 --http-enabled=false \
            --db=dev-file --https-port=18444 --hostname=https://localhost:18444 \
            --https-key-store-file="$lab/identity/https.p12" --cache=local --import-realm \
            > "$lab/identity/keycloak-server.log" 2>&1 &
          printf '%s' "$!" > "$lab/identity/keycloak.pid"
          for attempt in $(seq 1 120); do
            if curl --fail --silent --cacert "$lab/identity/ca.pem" --connect-timeout 1 --max-time 2 \
              https://localhost:18444/realms/kafdeck-g2/.well-known/openid-configuration > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'G2 Keycloak HTTPS discovery did not become ready.' >&2
          exit 1
      - name: Start disposable real Kafka effect fixture
        shell: bash
        run: docker compose -f deploy/dev/docker-compose.kafka.yml up -d --wait --wait-timeout 120
      - name: Start real Schema Registry and Connect family providers
        shell: bash
        run: |
          set -euo pipefail
          provider_root="$GITHUB_WORKSPACE/deploy/dev/.generated/g2/providers"
          mkdir -p "$provider_root"
          # Populate a confined, version-matched Connect plugin directory
          # from the same pinned Apache Kafka image as the real worker.
          # FileStream connectors are NOT on the worker plugin path by default.
          mkdir -p "$provider_root/connect-plugins/filestream"
          docker run --rm --network none --user 0:0 \
            -v "$provider_root/connect-plugins/filestream:/kafdeck-g2-plugin" \
            --entrypoint /bin/sh apache/kafka:4.3.1 \
            -c 'test -f /opt/kafka/libs/connect-file-4.3.1.jar && cp /opt/kafka/libs/connect-file-4.3.1.jar /kafdeck-g2-plugin/connect-file-4.3.1.jar'
          test -s "$provider_root/connect-plugins/filestream/connect-file-4.3.1.jar"
          cat > "$provider_root/connect.properties" <<'CONNECT'
          bootstrap.servers=127.0.0.1:9092
          group.id=g2-ci-connect
          plugin.path=/opt/kafka/g2-connect-plugins
          listeners=http://127.0.0.1:18083
          rest.advertised.host.name=127.0.0.1
          rest.advertised.port=18083
          config.storage.topic=_g2_ci_connect_config
          offset.storage.topic=_g2_ci_connect_offsets
          status.storage.topic=_g2_ci_connect_status
          config.storage.replication.factor=1
          offset.storage.replication.factor=1
          status.storage.replication.factor=1
          offset.storage.partitions=1
          status.storage.partitions=1
          key.converter=org.apache.kafka.connect.storage.StringConverter
          value.converter=org.apache.kafka.connect.storage.StringConverter
          CONNECT
          docker run -d --name kafdeck-g2-schema --network host \
            -e SCHEMA_REGISTRY_HOST_NAME=localhost \
            -e SCHEMA_REGISTRY_LISTENERS=http://127.0.0.1:18081 \
            -e SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS=PLAINTEXT://127.0.0.1:9092 \
            -e SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR=1 \
            confluentinc/cp-schema-registry:8.3.2
          docker run -d --name kafdeck-g2-connect --network host \
            -v "$provider_root/connect.properties:/opt/kafka/config/g2-connect.properties:ro" \
            -v "$provider_root/connect-plugins:/opt/kafka/g2-connect-plugins:ro" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --entrypoint /opt/kafka/bin/connect-distributed.sh \
            apache/kafka:4.3.1 /opt/kafka/config/g2-connect.properties
          docker run -d --name kafdeck-g2-destination --network host \
            -e KAFKA_NODE_ID=2 -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://127.0.0.1:9094,CONTROLLER://127.0.0.1:9095 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9094 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=2@127.0.0.1:9095 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e CLUSTER_ID=VjBHNnpPVUR5T1RncHRLZg apache/kafka:4.3.1
          for attempt in $(seq 1 150); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18081/subjects > /dev/null && \
               curl --fail --silent --max-time 2 http://127.0.0.1:18083/connectors > /dev/null && \
               docker exec kafdeck-g2-destination /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9094 --list > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "${ready:-0}" != 1 ]; then
            echo 'Actual Schema Registry/Connect readiness failed.' >&2
            exit 1
          fi
          curl --fail --silent --max-time 5 \
            http://127.0.0.1:18083/connector-plugins --output "$provider_root/plugin-catalog.json"
          python3 - "$provider_root/plugin-catalog.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f: items=json.load(f)
          if not isinstance(items,list) or sum(
              isinstance(item,dict) and
              item.get('class')=='org.apache.kafka.connect.file.FileStreamSinkConnector' and
              item.get('version')=='4.3.1'
              for item in items) != 1:
              raise SystemExit('Pinned actual Kafka Connect FileStream plugin was not discovered.')
          PY
      - name: Build and prove actual PKCE CLI and provider sockets
        shell: bash
        env:
          KAFDECK_TEST_POSTGRES: 'Host=127.0.0.1;Port=5432;Username=kafdeck;Password=kafdeck-g2-ci-only;Database=kafdeck;Pooling=false'
        run: |
          set -euo pipefail
          export KAFDECK_KEYCLOAK_G2_LAB="$GITHUB_WORKSPACE/deploy/dev/.generated/g2/identity/lab.json"
          export KAFDECK_G2_EVIDENCE_DIRECTORY="$GITHUB_WORKSPACE/artifacts/g2-ci/identity"
          export KAFDECK_G2_KAFKA_BOOTSTRAP=127.0.0.1:9092
          export KAFDECK_G2_KAFKA_DELETE_CAPABLE=1
          export KAFDECK_G2_KAFKA_DESTINATION_BOOTSTRAP=127.0.0.1:9094
          export KAFDECK_G2_SCHEMA_REGISTRY_URL=http://127.0.0.1:18081/
          export KAFDECK_G2_CONNECT_URL=http://127.0.0.1:18083/
          dotnet restore Kafdeck.slnx --locked-mode
          dotnet build Kafdeck.slnx --configuration Release --no-restore -warnaserror
          dotnet test tests/Kafdeck.Architecture.Tests/Kafdeck.Architecture.Tests.csproj --configuration Release --no-build --no-restore \
            --filter 'FullyQualifiedName~V08G2HumanCliLiveTests|FullyQualifiedName~V08G2ProviderFamilyCliLiveTests|FullyQualifiedName~V08G2DataJobUncertaintyCliLiveTests|FullyQualifiedName~V08G2HumanRecoveryCliLiveTests|FullyQualifiedName~V08W67FamilyBoundaryTests|FullyQualifiedName~V08FleetCapabilityParityTests|FullyQualifiedName~V08W67BearerOpenApiTests|FullyQualifiedName~V08W67ServiceCliBoundaryTests|FullyQualifiedName~V08W66PrivateHttpWireTests|FullyQualifiedName~V08W66ProviderCredentialLifecycleTlsTests|FullyQualifiedName~V08W66AuthenticatedWebhookTlsTests|FullyQualifiedName~V08W66ProviderPhysicalTlsTests|FullyQualifiedName~V08W66SmtpPhysicalTlsTests|FullyQualifiedName~V08W66ReceiptPersistenceTests|FullyQualifiedName~V08G2ProductNotificationTests' \
            --results-directory artifacts/g2-ci --logger 'trx;LogFileName=g2-live.trx'
          test -s "$KAFDECK_G2_EVIDENCE_DIRECTORY/human-cli-evidence.json"
          test -s "$KAFDECK_G2_EVIDENCE_DIRECTORY/human-cli-kafka-effect-evidence.json"
          test -s "$KAFDECK_G2_EVIDENCE_DIRECTORY/service-cli-kafka-effect-evidence.json"
          test -s "$KAFDECK_G2_EVIDENCE_DIRECTORY/human-kafka-product-notification-evidence.json"
          test -s "$KAFDECK_G2_EVIDENCE_DIRECTORY/critical-human-approval-kafka-evidence.json"
          test -s "$KAFDECK_G2_EVIDENCE_DIRECTORY/topic-cli-lifecycle-evidence.json"
          test -s "$KAFDECK_G2_EVIDENCE_DIRECTORY/postgres-topic-cli-lifecycle-evidence.json"
          for provider in sqlite postgres; do
            test -s "$KAFDECK_G2_EVIDENCE_DIRECTORY/$provider-real-provider-family-cli-evidence.json"
            test -s "$KAFDECK_G2_EVIDENCE_DIRECTORY/$provider-keycloak-human-cli-recovery-evidence.json"
            test -s "$KAFDECK_G2_EVIDENCE_DIRECTORY/$provider-generator-uncertainty-evidence.json"
            test -s "$KAFDECK_G2_EVIDENCE_DIRECTORY/$provider-data-job-uncertainty-evidence.json"
          done
          test -s "$KAFDECK_G2_EVIDENCE_DIRECTORY/postgres-human-kafka-product-notification-evidence.json"
      - name: Retain sanitized live acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g2-live-acceptance
          path: |
            artifacts/g2-ci/g2-live.trx
            artifacts/g2-ci/identity/*-evidence.json
          if-no-files-found: error
      - name: Stop isolated identity process
        if: always()
        shell: bash
        run: |
          pid_file="$GITHUB_WORKSPACE/deploy/dev/.generated/g2/identity/keycloak.pid"
          if [ -f "$pid_file" ]; then kill "$(cat "$pid_file")" 2>/dev/null || true; fi
          docker rm -f kafdeck-g2-schema kafdeck-g2-connect kafdeck-g2-destination 2>/dev/null || true
          docker compose -f deploy/dev/docker-compose.kafka.yml down --volumes --remove-orphans

  real-postgresql-fencing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: kafdeck
          POSTGRES_PASSWORD: kafdeck-g2-ci-only
          POSTGRES_DB: kafdeck
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kafdeck -d kafdeck"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore locked dependencies
        run: dotnet restore Kafdeck.slnx --locked-mode
      - name: Prove durable independent-worker concurrency and recovery
        env:
          KAFDECK_TEST_POSTGRES: 'Host=127.0.0.1;Port=5432;Username=kafdeck;Password=kafdeck-g2-ci-only;Database=kafdeck;Pooling=false'
          KAFDECK_G2_EVIDENCE_DIRECTORY: '${{ github.workspace }}/artifacts/g2-ci/postgres'
        run: >-
          dotnet test tests/Kafdeck.Architecture.Tests/Kafdeck.Architecture.Tests.csproj
          --configuration Release --no-restore --results-directory artifacts/g2-ci/postgres --logger 'trx;LogFileName=postgres-live.trx'
          --filter 'FullyQualifiedName~V08G2PostgreSqlProofTests|FullyQualifiedName~V08G2ProductNotificationTests|FullyQualifiedName~V08NotificationGovernanceTests|FullyQualifiedName~V08NotificationGovernanceHttpTests|FullyQualifiedName~V08NotificationGovernancePostgreSqlTests|FullyQualifiedName~V08NotificationHaAdmissionTests|FullyQualifiedName~V08W66PostgreSqlHostedTlsTests|FullyQualifiedName~V08W66NotificationDeliveryStoreTests|FullyQualifiedName~V08W66DeliveryWorkerTests|FullyQualifiedName~V08W66NotificationRoutingTests|FullyQualifiedName~V05MutationPersistenceTests'
      - name: Require real PostgreSQL evidence
        shell: bash
        run: |
          test -s artifacts/g2-ci/postgres/postgres-worker-cas-evidence.json
          test -s artifacts/g2-ci/postgres/postgres-recovery-fence-evidence.json
          test -s artifacts/g2-ci/postgres/postgres-rate-clock-evidence.json
          test -s artifacts/g2-ci/postgres/postgres-product-outbox-evidence.json
          test -s artifacts/g2-ci/postgres/product-source-tls-evidence.json
          test -s artifacts/g2-ci/postgres/postgres-governance-fairness-evidence.json
          for provider in webhook email slack microsoftteams telegram pagerduty; do
            test -s "artifacts/g2-ci/postgres/notification-governance-$provider-evidence.json"
          done
      - name: Retain sanitized PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g2-postgresql-acceptance
          path: |
            artifacts/g2-ci/postgres/*-evidence.json
            artifacts/g2-ci/postgres/postgres-live.trx
          if-no-files-found: error

  real-postgresql-failover-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Select existing native PostgreSQL tools
        shell: bash
        run: |
          set -euo pipefail
          pg_bin="$(pg_config --bindir)"
          for tool in postgres initdb pg_ctl psql pg_basebackup pg_verifybackup pg_controldata; do
            test -x "$pg_bin/$tool"
          done
          "$pg_bin/postgres" --version
          printf 'KAFDECK_G2_RECOVERY_BIN=%s\n' "$pg_bin" >> "$GITHUB_ENV"
      - name: Build real sender-process laboratory
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Kafdeck.slnx --locked-mode
          dotnet build Kafdeck.slnx --configuration Release --no-restore -warnaserror
          test -s tests/Kafdeck.NotificationSender.Lab/bin/Release/net10.0/Kafdeck.NotificationSender.Lab.dll
      - name: Prove sender loss, physical promotion and stale-backup refusal
        shell: bash
        run: |
          set -euo pipefail
          export KAFDECK_G2_RECOVERY_ROOT="$GITHUB_WORKSPACE/deploy/dev/.generated/g2-recovery/ci"
          export KAFDECK_G2_EVIDENCE_DIRECTORY="$GITHUB_WORKSPACE/artifacts/g2-ci/recovery"
          dotnet test tests/Kafdeck.Architecture.Tests/Kafdeck.Architecture.Tests.csproj --configuration Release --no-build --no-restore \
            --filter 'FullyQualifiedName~V08G2PostgreSqlRecoveryTests|FullyQualifiedName~V08G2PostgreSqlSafeResumeTests|FullyQualifiedName~V08W66GovernedRecoveryTests|FullyQualifiedName~V08W66SqliteRestoreResumeTests|FullyQualifiedName~V08W66RecoveryHttpBoundaryTests|FullyQualifiedName~V08W66DeliveryInterlockTests' \
            --results-directory artifacts/g2-ci/recovery --logger 'trx;LogFileName=recovery-live.trx'
          test -s "$KAFDECK_G2_EVIDENCE_DIRECTORY/postgres-before-claim-failover-evidence.json"
          test -s "$KAFDECK_G2_EVIDENCE_DIRECTORY/postgres-crash-after-post-failover-evidence.json"
          test -s "$KAFDECK_G2_EVIDENCE_DIRECTORY/postgres-stale-backup-quarantine-evidence.json"
          test -s "$KAFDECK_G2_EVIDENCE_DIRECTORY/postgres-governed-restore-safe-resume-evidence.json"
          test -s "$KAFDECK_G2_EVIDENCE_DIRECTORY/sqlite-governed-restore-safe-resume-evidence.json"
      - name: Retain bounded PostgreSQL control stage diagnostics
        if: always()
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE/deploy/dev/.generated/g2-recovery/ci"
          $target = "$env:GITHUB_WORKSPACE/artifacts/g2-ci/recovery"
          $actions = @('Prepare','Start','Status','Sync','Backup','Failover','Restore','FenceOriginalNodes','AdmitRestoreMaintenance','Stop')
          $stages = @('RuntimeDiscovery','PreparePorts','PrepareCredentials','PrimaryInit','PrimaryConfig',
            'PrimaryStart','ReplicationBootstrap','StandbySeed','StandbyConfig','StandbyStart','ReplicationStreaming',
            'ReplicationSynchronous','PrepareComplete','ManifestValidation','ActionStart','ActionSync','ActionBackup',
            'ActionFailover','ActionRestore','ActionStatus','ActionStop','ActionFenceOriginalNodes','ActionAdmitRestoreMaintenance')
          $records = @()
          if (Test-Path -LiteralPath $root) {
            $scenarios = @(Get-ChildItem -LiteralPath $root -Directory -Filter 'scenario-*' | Select-Object -First 32)
            foreach ($scenario in $scenarios) {
              foreach ($action in $actions) {
                $file = Join-Path $scenario.FullName ('control-' + $action.ToLowerInvariant() + '-diagnostic.json')
                if (!(Test-Path -LiteralPath $file -PathType Leaf) -or (Get-Item -LiteralPath $file).Length -gt 4096) { continue }
                try {
                  $value = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json -AsHashtable -Depth 4
                  if ($value.formatVersion -ne 1 -or $value.action -cne $action -or $value.stage -cnotin $stages -or
                      $value.state -cnotin @('Running','Failed','Succeeded')) { continue }
                  $nativeExit = $null
                  if ($null -ne $value.nativeExitCode) {
                    $parsedExit = 0
                    if (![int]::TryParse([string]$value.nativeExitCode,[ref]$parsedExit)) { continue }
                    $nativeExit = $parsedExit
                  }
                  # Reconstruct only closed stage fields. No paths, exception
                  # text, native logs, credentials or cluster files are uploaded.
                  $records += @{action=$action;stage=$value.stage;state=$value.state;nativeExitCode=$nativeExit}
                  Write-Host "G2_RECOVERY_DIAGNOSTIC action=$action;stage=$($value.stage);state=$($value.state);nativeExit=$nativeExit"
                } catch { Write-Host 'G2_RECOVERY_DIAGNOSTIC invalid-record-omitted' }
              }
            }
          }
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          @{formatVersion=1;records=$records;nativeLogsExcluded=$true} | ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath (Join-Path $target 'postgres-control-diagnostic-evidence.json') -Encoding utf8
      - name: Retain sanitized recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g2-postgresql-failover-restore
          path: |
            artifacts/g2-ci/recovery/recovery-live.trx
            artifacts/g2-ci/recovery/*-evidence.json
          if-no-files-found: error

  real-keycloak-ha-replay:
