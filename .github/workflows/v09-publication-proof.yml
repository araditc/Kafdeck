name: v09-publication-proof
on:
  push:
    branches: [codex/v09-publication-proof]
permissions:
  contents: read
jobs:
  local-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - run: python3 -B -m unittest discover -s publication/v09 -p 'test_*.py' -v
      - run: python3 -B publication/v09/local_proof.py
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-publication-proof-${{ github.run_id }}
          path: artifacts/v09-publication/local-proof.json
          if-no-files-found: warn
