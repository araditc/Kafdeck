name: v09-oci-d1
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  native-oci:
    name: actual signed OCI (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # x64 full proof retained from run42996452390; only remaining native ARM cell executes.
        include:
          - {arch: arm64, rid: linux-arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Authenticate exact official signed source and media before isolation
        env:
          GH_TOKEN: ${{ github.token }}
          D1_RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          private="$RUNNER_TEMP/d1-signed-oci"
          mkdir -m 700 "$private"
          python3 -B deploy/dev/oci-d1/stage.py "$private" "$GITHUB_WORKSPACE/artifacts/oci-d1" \
            0ba58f6c09c271f664f0f8c1fa62e2065844ca89a0397c0178ed5188f6096724
      - name: Stage genuine Keycloak and Kafka before network isolation
        run: |
          set -euo pipefail
          private="$RUNNER_TEMP/d1-signed-oci"
          curl --fail --silent --show-error --location --max-time 180 \
            https://github.com/keycloak/keycloak/releases/download/26.8.1/keycloak-26.8.1.zip --output "$private/keycloak.zip"
          echo "4cd312c889af358a819a74a6c6f068f9ea159a6959e49924607cec95cfd4c1a4  $private/keycloak.zip" | sha256sum --check
          unzip -q "$private/keycloak.zip" -d "$private"
          pwsh -NoProfile -File deploy/dev/prepare-keycloak-g2.ps1 -KeycloakHome "$private/keycloak-26.8.1" \
            -OutputDirectory "$private/identity" -HttpsPort 18444
          chmod +x "$private/keycloak-26.8.1/bin/kc.sh"
          docker pull apache/kafka:4.3.1
          image_id="$(docker image inspect --format '{{.Id}}' apache/kafka:4.3.1)"
          container="$(docker create --network none "$image_id")"
          docker cp "$container:/opt/kafka" "$private/kafka"
          docker rm "$container"
          java_home="${JAVA_HOME_21_X64:-${JAVA_HOME_21_ARM64:-}}"
          test -x "$java_home/bin/java"
          echo "D1_JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          PRIVATE="$private" IMAGE_ID="$image_id" JAVA_RUNTIME="$java_home/bin/java" python3 -B - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          p=pathlib.Path(os.environ['PRIVATE'])
          def sha(path):
              with pathlib.Path(path).open('rb') as stream:return hashlib.file_digest(stream,'sha256').hexdigest()
          entries=[(str(x.relative_to(p/'kafka')),sha(x)) for x in sorted((p/'kafka').rglob('*')) if x.is_file()]
          d={'keycloakVersion':'26.8.1','keycloakZipSha256':sha(p/'keycloak.zip'),'kafkaVersion':'4.3.1',
             'kafkaImageConfigDigest':os.environ['IMAGE_ID'],'kafkaDistributionSha256':hashlib.sha256(json.dumps(entries).encode()).hexdigest(),
             'javaExecutableSha256':sha(os.environ['JAVA_RUNTIME']),
             'javaVersion':subprocess.run([os.environ['JAVA_RUNTIME'],'-version'],capture_output=True,text=True,check=True).stderr.splitlines()[0],
             'stagedBeforeNetworkIsolation':True,'runtimeDependencyDownloads':False}
          assert '21.' in d['javaVersion']
          pathlib.Path('artifacts/oci-d1/dependencies.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - name: Actual signed OCI authentication broker persistence restart and restore
        env:
          D1_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          export JAVA_HOME="$D1_JAVA_HOME"
          bash deploy/dev/oci-d1/run.sh "$RUNNER_TEMP/d1-signed-oci" "$GITHUB_WORKSPACE/artifacts/oci-d1" "$D1_ARCH"
      - name: Retain public evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: oci-d1-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            artifacts/oci-d1/signed-input.json
            artifacts/oci-d1/dependencies.json
            artifacts/oci-d1/trust-root-observation.json
            artifacts/oci-d1/oci-identity.json
            artifacts/oci-d1/journey.json
            artifacts/oci-d1/writer-fence.json
          if-no-files-found: warn
