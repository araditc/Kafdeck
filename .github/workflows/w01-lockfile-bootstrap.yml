name: w01-lockfile-bootstrap

on:
  push:
    branches: [feat/v0.1-w01-scaffold]
    paths:
      - src/frontend/package.json
      - .github/workflows/w01-lockfile-bootstrap.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'

      - name: Refresh and commit npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          cd src/frontend
          npm install --package-lock-only --ignore-scripts
          cd ../..
          if git diff --quiet -- src/frontend/package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/frontend/package-lock.json
          git commit -m "chore(frontend): refresh npm lockfile" -m "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push origin HEAD:feat/v0.1-w01-scaffold
