name: windows-offline-publication
on:
  pull_request:
    paths: ['publication/v1-offline/**', '.github/workflows/windows-offline-publication.yml']
  workflow_dispatch:
    inputs:
      owner_approval:
        description: 'PUBLISH OFFLINE 1.0.0'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: windows-offline-stable-publication
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m py_compile publication/v1-offline/publish.py
      - run: python3 -B -m unittest discover -s publication/v1-offline -p test_package.py -v
      - run: python3 -m json.tool publication/v1-offline/vendors.json > /dev/null
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build reviewed offline installer and verify remote publication
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_APPROVAL: ${{ inputs.owner_approval }}
        run: python -X utf8 publication/v1-offline/publish.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: windows-offline-publication-${{ github.run_id }}
          path: |
            artifacts/windows-supplement/publication-receipt.json
            artifacts/windows-supplement/package/windows-offline-1.0.0-provenance.json
            artifacts/windows-supplement/package/bundle/bundle-manifest.json
          if-no-files-found: ignore
