name: release-supply-chain

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'src/**'
      - '.github/workflows/release-supply-chain.yml'
      - '.github/workflows/publish-release.yml'
      - '.github/release/release.json'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build immutable candidate once
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: kafdeck:evidence-${{ github.event.pull_request.head.sha }}

      - name: Select exact candidate reference
        shell: bash
        run: echo "CANDIDATE_REF=kafdeck:evidence-${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"

      - name: Generate SPDX SBOM for exact candidate
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.CANDIDATE_REF }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Scan exact candidate for High/Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.CANDIDATE_REF }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: false
          exit-code: '1'

      - name: Retain exact-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            sbom.spdx.json
            trivy-results.sarif
          if-no-files-found: warn
