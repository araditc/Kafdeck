name: release-supply-chain

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'src/**'
      - '.github/workflows/release-supply-chain.yml'
      - '.github/workflows/publish-release.yml'
      - '.github/release/release.json'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build immutable candidate once
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: kafdeck:evidence-${{ github.event.pull_request.head.sha }}

      - name: Select exact candidate reference
        shell: bash
        run: echo "CANDIDATE_REF=kafdeck:evidence-${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"

      - name: Generate SPDX SBOM for exact candidate
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.CANDIDATE_REF }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Scan exact candidate for High/Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.CANDIDATE_REF }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: false
          exit-code: '1'

      - name: Retain exact-head evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            sbom.spdx.json
            trivy-results.sarif
          if-no-files-found: warn
