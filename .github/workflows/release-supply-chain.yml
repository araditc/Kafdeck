name: release-supply-chain

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'src/**'
      - '.github/workflows/release-supply-chain.yml'
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build immutable candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: kafdeck:evidence-${{ github.sha }}

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: kafdeck:evidence-${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Scan candidate for High/Critical vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: kafdeck:evidence-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Retain exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            sbom.spdx.json
            trivy-results.sarif
          if-no-files-found: warn

      - name: Log in to GHCR for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable tagged image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@v3

      - name: Keyless-sign published digest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
