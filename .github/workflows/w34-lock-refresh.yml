name: w34-lock-refresh

on:
  pull_request:
    paths:
      - '.github/workflows/w34-lock-refresh.yml'
      - 'src/backend/Modules/Kafdeck.Modules.Records/**'
      - 'src/backend/Kafdeck.Api/**'
      - 'Directory.Packages.props'

permissions:
  contents: read

jobs:
  lock-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Regenerate lock graph without modifying the repository
        run: dotnet restore Kafdeck.slnx --force-evaluate

      - name: Emit refreshed API lockfile
        shell: bash
        run: |
          echo 'KAFDECK_W34_LOCK_BEGIN'
          cat src/backend/Kafdeck.Api/packages.lock.json
          echo 'KAFDECK_W34_LOCK_END'
