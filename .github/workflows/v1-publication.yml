name: v1-publication

on:
  pull_request:
    paths:
      - 'publication/v1/**'
      - '.github/workflows/v1-publication.yml'
  push:
    branches: [main]
    paths:
      - 'publication/v1/**'
      - '.github/workflows/v1-publication.yml'
  workflow_dispatch:
    inputs:
      owner_approval:
        description: 'Exact PUBLISH <tag> FROM <source> MANIFEST <digest>'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v1-stable-publication
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify publication guards and immutable input identities
        run: python3 -B -m unittest discover -s publication/v1 -p 'test_*.py' -v

  authorize:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check exact owner decision and protected publisher
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_APPROVAL: ${{ inputs.owner_approval }}
        run: python3 publication/v1/driver.py preflight

  publish:
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Verify signature offline and publish exact selected files and images
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          OWNER_APPROVAL: ${{ inputs.owner_approval }}
        run: python3 publication/v1/driver.py publish
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: v1-publication-result-${{ github.run_id }}
          path: |
            artifacts/v1-publication/publication-selection.json
            artifacts/v1-publication/publication-result.json
            artifacts/v1-publication/assets/SHA256SUMS
          if-no-files-found: warn
          retention-days: 90
