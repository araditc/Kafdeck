name: open-governance-pr

on:
  push:
    branches: [chore/governance-shared-sensitive-codeowners]
    paths:
      - .github/workflows/open-governance-pr.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_BRANCH: chore/governance-shared-sensitive-codeowners
    steps:
      - name: Open governance pull request if absent
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" --base main --state open --json number --jq 'length')"
          if [[ "$existing" != "0" ]]; then
            echo "An open PR already exists for $HEAD_BRANCH."
            exit 0
          fi
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$HEAD_BRANCH" \
            --title "chore(governance): share sensitive-area code ownership" \
            --body "Share explicit ownership of governance/security-sensitive areas between @ammarheidari and @akhiabanchian so the active Code Owner review rule remains enforceable without a single-maintainer deadlock. No ruleset bypass is requested."
