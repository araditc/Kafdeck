name: quality-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate repository structure and workflow pinning
        run: bash scripts/ci/validate-repository.sh

      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/validate-pr-commits.sh

      - name: Detect implementation scaffolds
        id: detect
        shell: bash
        run: |
          if find src tests -type f -name '*.csproj' -print -quit 2>/dev/null | grep -q .; then echo "backend=true" >> "$GITHUB_OUTPUT"; else echo "backend=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f src/frontend/package.json ]; then echo "frontend=true" >> "$GITHUB_OUTPUT"; else echo "frontend=false" >> "$GITHUB_OUTPUT"; fi

      - name: Setup .NET
        if: steps.detect.outputs.backend == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Backend build and tests
        if: steps.detect.outputs.backend == 'true'
        run: bash scripts/ci/backend.sh

      - name: Setup Node.js
        if: steps.detect.outputs.frontend == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'

      - name: Frontend build and tests
        if: steps.detect.outputs.frontend == 'true'
        run: bash scripts/ci/frontend.sh

      # W01 review-fix bootstrap only. Removed after the generated lockfile is committed.
      - name: Capture updated npm lockfile
        if: github.event_name == 'pull_request' && steps.detect.outputs.frontend == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: w01-package-lock
          path: src/frontend/package-lock.json
          archive: false
          retention-days: 1
